apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eso-allow-operator-egress
spec:
  podSelector:
    matchLabels:
      app: external-secrets-operator
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
