apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    email: ops@list.massopen.cloud
    privateKeySecretRef:
      name: letsencrypt-production-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          route53:
            region: us-east-1
            # Role is created by the openshift-oidc module in CCI-MOC/moc-aws
            # and trusts only system:serviceaccount:cert-manager:cert-manager.
            role: arn:aws:iam::574733721584:role/cert-manager-moc-infra
            auth:
              kubernetes:
                serviceAccountRef:
                  name: cert-manager
        selector:
          dnsZones:
            - moc-infra.massopen.cloud
