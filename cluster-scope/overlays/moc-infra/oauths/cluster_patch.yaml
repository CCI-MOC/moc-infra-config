apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: mocsso
    mappingMethod: claim
    type: OpenID
    openID:
      clientID: moc-infra
      clientSecret:
        name: keycloak-client-secret
      claims:
        preferredUsername:
        - preferred_username
        - username
        name:
        - name
        - full name
        email:
        - email
        groups:
        - groups
      issuer: https://sso.massopen.cloud/realms/moc
      extraScopes:
      - groups
