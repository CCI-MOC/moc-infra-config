apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    # Role is created by the openshift-oidc module in CCI-MOC/moc-aws and trusts
    # only system:serviceaccount:external-secrets:external-secrets-sa.
    eks.amazonaws.com/role-arn: arn:aws:iam::574733721584:role/eso-moc-infra
