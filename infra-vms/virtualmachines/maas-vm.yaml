apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    "kubevirt.io/vm-delete-protection": "True"
  name: maas
spec:
  runStrategy: Always
  template:
    spec:
      evictionStrategy: LiveMigrate
      domain:
        devices:
          interfaces:
          - name: moc-vlan-204
            bridge: {}
          - name: ipmi-vlan-911
            bridge: {}
          disks:
          - name: boot-disk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
        cpu:
          sockets: 1
          cores: 8
          threads: 1
        resources:
          requests:
            memory: 8Gi
            cpu: 2
          limits:
            memory: 32Gi
            cpu: 8
      networks:
      - name: moc-vlan-204
        multus:
          networkName: infrastructure-vms/vlan204-no-ipam
      - name: ipmi-vlan-911
        multus:
          networkName: infrastructure-vms/vlan911-no-ipam
      volumes:
      - name: boot-disk
        dataVolume:
          name: maas-vm-rootdisk
      - name: cloudinitdisk
        cloudInitNoCloud:
          networkData: |
            version: 2
            ethernets:
              enp1s0:
                dhcp4: false
                addresses:
                  - 172.16.96.5/24
                gateway4: 172.16.96.1
          userData: |
            #cloud-config
            ssh_authorized_keys:
              - ssh-rsa 
